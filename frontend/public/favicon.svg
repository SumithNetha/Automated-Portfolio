<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E1C" />
      <stop offset="100%" stop-color="#0F0F0D" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#10B981" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base App Tile with Subtle Border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#383632" stroke-width="1.5"/>

  <!-- Geometric Monogram S -->
  <path d="M 28 23 C 28 19 25.5 17 21 17 C 16.5 17 14.5 19.5 14.5 23 C 14.5 28.5 28 27.5 28 35.5 C 28 39.5 25 42 20.5 42 C 16 42 14 38.5 14 35" 
        stroke="#FAF9F5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Geometric Monogram M -->
  <path d="M 34 42 V 17.5 L 42 30 L 50 17.5 V 42" 
        stroke="#FAF9F5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Live Pulse Dot (Emerald) -->
  <circle cx="51" cy="13" r="3.2" fill="#10B981" filter="url(#glow)"/>
  <circle cx="51" cy="13" r="5.2" stroke="#10B981" stroke-width="1" stroke-opacity="0.5"/>
</svg>
